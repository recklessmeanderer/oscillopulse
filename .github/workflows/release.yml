name: Build & Release APK

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to compile'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'debug'
          - 'release'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK & Attach to Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission and normalize line endings for gradlew
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Prepare Build Environment & Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 1. Ensure .env exists from template so secrets plugin does not fail
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # 2. Ensure debug keystore is present
          if [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode -i debug.keystore.base64 > debug.keystore 2>/dev/null || true
              echo "Decoded debug.keystore from debug.keystore.base64."
            fi
            if [ ! -s debug.keystore ]; then
              echo "Generating standard debug.keystore fallback..."
              rm -f debug.keystore
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 3. Decode custom release keystore if provided in repository secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks 2>/dev/null || echo "$KEYSTORE_BASE64" | base64 --decode -i > my-upload-key.jks 2>/dev/null || true
            echo "Decoded release keystore (my-upload-key.jks) from secrets."
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TYPE_INPUT: ${{ inputs.build_type || 'auto' }}
        run: |
          mkdir -p dist

          # Format friendly version tag
          TAG_VAL="${{ github.event.release.tag_name || github.ref_name || 'latest' }}"
          CLEAN_REF=$(echo "$TAG_VAL" | tr '/' '-')
          echo "Building APK for tag/ref: $CLEAN_REF"

          # Build Debug APK (installs on any Android device without certificate registration)
          if [ "$BUILD_TYPE_INPUT" = "auto" ] || [ "$BUILD_TYPE_INPUT" = "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew :app:assembleDebug --no-daemon --stacktrace

            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              cp app/build/outputs/apk/debug/app-debug.apk "dist/OscilloPulse-${CLEAN_REF}-debug.apk"
              cp app/build/outputs/apk/debug/app-debug.apk "dist/OscilloPulse.apk"
              echo "Debug APK built successfully."
            else
              echo "Error: app-debug.apk not found after assembleDebug!"
              exit 1
            fi
          fi

          # Build Release APK if signing secrets are provided or requested
          if [ -f my-upload-key.jks ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Building Release APK with custom upload key..."
            ./gradlew :app:assembleRelease --no-daemon --stacktrace

            if [ -f app/build/outputs/apk/release/app-release.apk ]; then
              cp app/build/outputs/apk/release/app-release.apk "dist/OscilloPulse-${CLEAN_REF}-release.apk"
              cp app/build/outputs/apk/release/app-release.apk "dist/OscilloPulse.apk"
              echo "Release APK built successfully."
            fi
          elif [ "$BUILD_TYPE_INPUT" = "release" ]; then
            echo "Warning: Release build requested but KEYSTORE_BASE64/STORE_PASSWORD secrets were not found."
            echo "Falling back to signed debug APK as the release deliverable."
          fi

          echo "Generated APK deliverables in dist/:"
          ls -la dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OscilloPulse-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (action-gh-release)
        id: gh_release
        continue-on-error: true
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: ${{ github.event.release.name || github.event.release.tag_name || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback Release Upload via GitHub CLI
        if: (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')) && steps.gh_release.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          echo "Attempting fallback release publish via gh CLI for tag: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release '$TAG_NAME' exists. Uploading APK assets with --clobber..."
            gh release upload "$TAG_NAME" dist/*.apk --clobber
          else
            echo "Release '$TAG_NAME' does not exist yet. Creating release and attaching APK assets..."
            gh release create "$TAG_NAME" dist/*.apk \
              --title "Release $TAG_NAME" \
              --generate-notes
          fi
          echo "Release APK assets published successfully via gh CLI!"
